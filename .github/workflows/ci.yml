name: CI

on:
  push:
    branches: [main, for-first-release, table-redesign]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          gleam-version: "1.11"

      - name: Install dependencies
        run: gleam deps fetch

      - name: Build
        run: gleam build

      - name: Test
        run: gleam test
